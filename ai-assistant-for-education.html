<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI Assistant for Education project page by Trishala Gosar with a video showcase and case-study overview."
    />
    <title>AI Assistant for Education | Trishala Gosar</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root {
        --ink: #181713;
        --muted: #6f6b61;
        --paper: #fbfaf6;
        --surface: #ffffff;
        --line: #ded9cc;
        --sage: #537568;
        --terra: #3f746c;
        --gold: #d7a948;
        --sky: #7ca7b8;
        --aqua-rgb: 70, 199, 195;
        --orchid-rgb: 198, 118, 180;
        --shadow: 0 18px 44px rgba(24, 23, 19, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background-color: #ffffff;
        background-image:
          radial-gradient(circle at 12% 6%, rgba(124, 167, 184, 0.18), transparent 28rem),
          radial-gradient(circle at 90% 8%, rgba(var(--orchid-rgb), 0.14), transparent 28rem),
          radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: auto, auto, 16px 16px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      a {
        color: inherit;
      }

      .wrap {
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(222, 217, 204, 0.76);
        background: rgba(251, 250, 246, 0.9);
        backdrop-filter: blur(16px);
      }

      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 80px;
        gap: 20px;
      }

      .brand,
      .nav-links a,
      .button {
        text-decoration: none;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 680;
      }

      .brand span {
        line-height: 1;
      }

      .brand-mark {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
      }

      .brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .nav-links a {
        padding: 10px 10px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 0.94rem;
        font-weight: 560;
      }

      .nav-links a:hover {
        color: var(--ink);
        background: linear-gradient(
          135deg,
          rgba(var(--aqua-rgb), 0.12),
          rgba(var(--orchid-rgb), 0.1)
        );
      }

      .case-minimap {
        position: fixed;
        left: max(20px, calc((100vw - 1160px) / 4));
        top: 50%;
        z-index: 8;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: translateY(-50%);
      }

      .case-minimap-links {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
      }

      .case-minimap-links a {
        width: 12px;
        height: 12px;
        border: 1px solid rgba(83, 117, 104, 0.4);
        border-radius: 50%;
        background: rgba(83, 117, 104, 0.14);
        font-size: 0;
        line-height: 0;
      }

      .case-minimap-links a:hover,
      .case-minimap-links a:focus-visible {
        background: var(--sage);
        border-color: var(--sage);
        outline: none;
      }

      .case-minimap-links a:focus-visible {
        box-shadow: 0 0 0 4px rgba(83, 117, 104, 0.14);
      }

      .case-hero {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
        gap: clamp(28px, 6vw, 72px);
        align-items: center;
        padding: 68px 0 54px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--terra);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1,
      h2,
      .stat strong {
        font-family: Georgia, "Times New Roman", serif;
      }

      h1 {
        margin-bottom: 22px;
        font-size: clamp(3rem, 6.2vw, 5.7rem);
        line-height: 0.96;
      }

      h2 {
        margin-bottom: 18px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1;
      }

      h3 {
        margin-bottom: 10px;
        font-size: 1.08rem;
      }

      .lede {
        color: #403d36;
        font-size: clamp(1.08rem, 2vw, 1.28rem);
      }

      .muted,
      .card p,
      .panel p,
      .quote-band p {
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 640;
      }

      .button.secondary {
        background: transparent;
        color: var(--ink);
      }

      .hero-visual {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.2), transparent 7rem),
          linear-gradient(
            135deg,
            rgba(var(--aqua-rgb), 0.92),
            rgba(124, 167, 184, 0.8),
            rgba(var(--orchid-rgb), 0.68)
          );
        box-shadow: var(--shadow);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 14px;
        min-height: 420px;
        padding: 18px;
      }

      .hero-column,
      .hero-stack {
        display: grid;
        gap: 14px;
      }

      .hero-column {
        grid-template-rows: auto 1fr;
      }

      .hero-card,
      .hero-tile,
      .assistant-bubble {
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.16);
      }

      .hero-card {
        padding: 18px;
        color: #fff;
      }

      .hero-card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1.24rem;
      }

      .assistant-stage {
        display: grid;
        gap: 12px;
        padding: 18px;
      }

      .assistant-bubble {
        padding: 14px;
        color: #fff;
      }

      .assistant-bubble:nth-child(2) {
        width: 82%;
        justify-self: end;
        background: rgba(24, 23, 19, 0.22);
      }

      .hero-stack {
        grid-template-rows: 1fr 0.9fr 0.8fr;
      }

      .hero-tile {
        min-height: 96px;
      }

      .hero-tile:nth-child(1) {
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.08));
      }

      .hero-tile:nth-child(2) {
        background: rgba(255, 255, 255, 0.88);
      }

      .hero-tile:nth-child(3) {
        background:
          linear-gradient(135deg, rgba(179, 92, 62, 0.8), rgba(215, 169, 72, 0.72));
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        padding: 0 0 56px;
      }

      .stat,
      .card,
      .panel,
      .video-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .stat {
        min-height: 122px;
        padding: 18px;
      }

      .stat strong {
        display: block;
        margin-bottom: 6px;
        font-size: 2.1rem;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      section {
        padding: 76px 0;
      }

      .section-head {
        display: grid;
        grid-template-columns: minmax(220px, 0.34fr) minmax(0, 0.66fr);
        gap: 30px;
        align-items: end;
        margin-bottom: 30px;
      }

      .grid-3,
      .grid-2 {
        display: grid;
        gap: 16px;
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card,
      .panel {
        padding: 22px;
      }

      .tag-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .tag {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fbfaf6;
        color: #47433b;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .list {
        display: grid;
        gap: 10px;
        margin: 16px 0 0;
        padding-left: 20px;
        color: var(--muted);
      }

      .video-card {
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .video-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfaf6;
      }

      .video-topbar strong {
        font-size: 0.98rem;
      }

      .video-frame {
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .frame-note {
        padding: 14px 18px 18px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .quote-band {
        background: var(--ink);
        color: var(--paper);
      }

      blockquote {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1.14;
      }

      footer {
        padding: 30px 0 42px;
        color: var(--muted);
      }

      #overview,
      #demo,
      #opportunity,
      #experience,
      #next {
        scroll-margin-top: 104px;
      }

      @media (max-width: 920px) {
        .case-minimap {
          left: 14px;
        }

        .case-hero,
        .section-head,
        .grid-2 {
          grid-template-columns: 1fr;
        }

        .meta-grid,
        .grid-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .wrap {
          width: min(100% - 28px, 1160px);
        }

        .nav-inner {
          align-items: flex-start;
          flex-direction: column;
          padding: 14px 0;
        }

        .nav-links {
          justify-content: flex-start;
        }

        .nav-links a {
          padding-left: 0;
        }

        .case-minimap {
          display: none;
        }

        h1 {
          font-size: clamp(2.8rem, 14vw, 4.2rem);
        }

        .meta-grid,
        .grid-3,
        .hero-grid {
          grid-template-columns: 1fr;
        }

        .hero-grid {
          min-height: auto;
        }

        section {
          padding: 58px 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="video-card" style="margin: 40px auto; max-width: 960px;">
        <div class="video-topbar">
          <strong>AI Assistant for Education</strong>
          <span>Coming soon</span>
        </div>
        <div class="video-frame">
          <iframe
            src="https://www.youtube.com/embed/phaQySmB66Q"
            title="AI Assistant for Education video showcase"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
